name: suivi-depenses

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suivi_depenses}
      POSTGRES_USER: ${POSTGRES_USER:-suivi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    profiles: ["docker"]
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-suivi_depenses}
      POSTGRES_USER: ${POSTGRES_USER:-suivi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
