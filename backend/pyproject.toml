[project]
name = "suivi-depenses-backend"
version = "0.1.0"
description = "API FastAPI de l'application Suivi de dépenses"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sentry-sdk[fastapi]>=2.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: test sans dépendance externe",
    "integration: test nécessitant PostgreSQL",
]
